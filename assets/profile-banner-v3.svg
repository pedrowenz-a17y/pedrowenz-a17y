<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Henrique Wenz | Developer portfolio</title>
  <desc id="desc">Animated bilingual developer banner in Portuguese and English, with a dark editorial design and an abstract code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101B"/><stop offset=".6" stop-color="#11182B"/><stop offset="1" stop-color="#0C1C24"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5B4FC"/><stop offset=".55" stop-color="#8AC9FF"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity=".24"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop stop-color="#2DD4BF" stop-opacity=".14"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A5B4FC" opacity=".11"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .pt {animation: pt 12s infinite;}
      .en {opacity:0;animation: en 12s infinite;}
      .cursor {animation: blink 1.6s ease-in-out infinite;}
      .trace {animation: flow 9s linear infinite;}
      .progress {transform-origin:64px 323px;animation: progress 6s linear infinite;}
      @keyframes pt {0%,44%,100%{opacity:1} 50%,94%{opacity:0}}
      @keyframes en {0%,44%,100%{opacity:0} 50%,94%{opacity:1}}
      @keyframes blink {0%,100%{opacity:1} 50%{opacity:.25}}
      @keyframes flow {to{stroke-dashoffset:-590}}
      @keyframes progress {from{transform:scaleX(.02)}to{transform:scaleX(1)}}
      @media (prefers-reduced-motion: reduce) {.pt,.en,.cursor,.trace,.progress{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <ellipse cx="990" cy="50" rx="450" ry="310" fill="url(#halo)"/>
    <ellipse cx="1050" cy="340" rx="330" ry="260" fill="url(#halo2)"/>
    <rect x="735" width="465" height="360" fill="url(#dots)"/>
    <g fill="none" stroke="#A5B4FC" stroke-opacity=".11">
      <circle cx="1050" cy="175" r="172"/><circle cx="1050" cy="175" r="212"/>
      <path d="M708 280H760L795 315H1160L1200 275"/>
      <path d="M772 42H1130L1200 112"/>
    </g>
    <path class="trace" d="M708 280H760L795 315H1160L1200 275" fill="none" stroke="url(#accent)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="35 555" opacity=".65"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="64" y="47" width="29" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="104" y="52" font-size="12" fill="#A5B4FC" letter-spacing="2.4" font-weight="700">DEVELOPER PORTFOLIO</text>
      <text x="62" y="121" font-size="52" letter-spacing="-1.6" font-weight="700" fill="#F1F5F9">Pedro Henrique Wenz</text>
      <g class="pt">
        <text x="64" y="167" font-size="24" font-weight="700" fill="url(#accent)">Desenvolvimento de software</text>
        <text x="64" y="205" font-size="18" fill="#AEBBD0">Aplicações web, inteligência artificial e automação.</text>
        <text x="84" y="285" font-size="14" fill="#B8C8D8">Tecnologia, criatividade e evolução contínua</text>
        <text x="683" y="324" text-anchor="end" font-size="11" letter-spacing="1.2" fill="#9DAAC0">PT-BR / 01</text>
      </g>
      <g class="en">
        <text x="64" y="167" font-size="24" font-weight="700" fill="url(#accent)">Software development</text>
        <text x="64" y="205" font-size="18" fill="#AEBBD0">Web applications, artificial intelligence and automation.</text>
        <text x="84" y="285" font-size="14" fill="#B8C8D8">Technology, creativity and continuous learning</text>
        <text x="683" y="324" text-anchor="end" font-size="11" letter-spacing="1.2" fill="#9DAAC0">EN / 02</text>
      </g>
      <g font-size="12" font-weight="600" fill="#D6E0EE">
        <rect x="64" y="226" width="70" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="99" y="245" text-anchor="middle">React</text>
        <rect x="144" y="226" width="92" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="190" y="245" text-anchor="middle">Supabase</text>
        <rect x="246" y="226" width="82" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="287" y="245" text-anchor="middle">Next.js</text>
        <rect x="338" y="226" width="91" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="383.5" y="245" text-anchor="middle">AI &amp; Code</text>
      </g>
      <circle cx="69" cy="280" r="4" fill="#5EEAD4"/>
      <rect x="64" y="322" width="530" height="2" rx="1" fill="#29364B"/>
      <rect class="progress" x="64" y="322" width="530" height="2" rx="1" fill="url(#accent)"/>
    </g>
    <g transform="translate(762 77)">
      <rect x="9" y="10" width="365" height="208" rx="15" fill="#070C15" opacity=".5"/>
      <rect width="365" height="208" rx="15" fill="#0D1523" stroke="#3A4962"/>
      <path d="M0 36H365" stroke="#2B364A"/>
      <circle cx="20" cy="18" r="4.5" fill="#F28B82"/><circle cx="35" cy="18" r="4.5" fill="#F2CD80"/><circle cx="50" cy="18" r="4.5" fill="#7DD3B0"/>
      <text x="182" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#9DAAC0">developer.ts</text>
      <g font-family="monospace" font-size="14">
        <text x="21" y="64" fill="#66758C">01</text><text x="54" y="64"><tspan fill="#C4B5FD">const</tspan><tspan fill="#E2E8F0"> developer = {</tspan></text>
        <text x="21" y="90" fill="#66758C">02</text><text x="68" y="90"><tspan fill="#93C5FD">focus:</tspan><tspan fill="#A7F3D0"> "software",</tspan></text>
        <text x="21" y="116" fill="#66758C">03</text><text x="68" y="116"><tspan fill="#93C5FD">curiosity:</tspan><tspan fill="#F5D0A9"> true,</tspan></text>
        <text x="21" y="142" fill="#66758C">04</text><text x="68" y="142"><tspan fill="#93C5FD">learning:</tspan><tspan fill="#A7F3D0"> "always"</tspan></text>
        <text x="21" y="168" fill="#66758C">05</text><text x="54" y="168" fill="#E2E8F0">};</text>
        <rect class="cursor" x="77" y="155" width="8" height="17" rx="1" fill="#5EEAD4"/>
      </g>
      <rect x="14" y="183" width="337" height="1" fill="#263247"/>
      <text x="20" y="197" font-family="monospace" font-size="9" fill="#8190A8">TypeScript</text>
      <text x="345" y="197" font-family="monospace" text-anchor="end" font-size="9" fill="#8190A8">UTF-8</text>
    </g>
    <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#3B4A61"/>
  </g>
</svg>