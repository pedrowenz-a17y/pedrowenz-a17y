<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Henrique Wenz | Developer portfolio</title>
  <desc id="desc">Animated bilingual developer banner in Portuguese and English, with a dark editorial design and an abstract code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101B"/><stop offset=".6" stop-color="#11182B"/><stop offset="1" stop-color="#0C1C24"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5B4FC"/><stop offset=".55" stop-color="#8AC9FF"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity=".24"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop stop-color="#2DD4BF" stop-opacity=".14"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A5B4FC" opacity=".11"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
    <clipPath id="type0"><rect x="54" y="52" width="330" height="20" class="typing typing0" style="animation-delay:0s"/></clipPath><clipPath id="type1"><rect x="54" y="76" width="330" height="20" class="typing typing1" style="animation-delay:0s"/></clipPath><clipPath id="type2"><rect x="54" y="100" width="330" height="20" class="typing typing2" style="animation-delay:0s"/></clipPath><clipPath id="type3"><rect x="54" y="124" width="330" height="20" class="typing typing3" style="animation-delay:0s"/></clipPath><clipPath id="type4"><rect x="54" y="148" width="330" height="20" class="typing typing4" style="animation-delay:0s"/></clipPath><clipPath id="type5"><rect x="54" y="172" width="330" height="20" class="typing typing5" style="animation-delay:0s"/></clipPath><style>
      .editor {transform-origin:190px 118px;animation:editorOpen 12s ease-in-out infinite;}
      @keyframes editorOpen {0%,3%{opacity:0;transform:translateY(18px) scale(.85)} 9%,91%{opacity:1;transform:translateY(0) scale(1)} 97%,100%{opacity:0;transform:translateY(12px) scale(.92)}}
      .typing0{animation:type0 12s steps(31,end) infinite;transform-origin:54px 52px;} @keyframes type0{0%,10%{transform:scaleX(0)} 18%,91%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)}}
.typing1{animation:type1 12s steps(1,end) infinite;transform-origin:54px 76px;} @keyframes type1{0%,19%{transform:scaleX(0)} 27%,91%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)}}
.typing2{animation:type2 12s steps(27,end) infinite;transform-origin:54px 100px;} @keyframes type2{0%,28%{transform:scaleX(0)} 36%,91%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)}}
.typing3{animation:type3 12s steps(16,end) infinite;transform-origin:54px 124px;} @keyframes type3{0%,37%{transform:scaleX(0)} 45%,91%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)}}
.typing4{animation:type4 12s steps(23,end) infinite;transform-origin:54px 148px;} @keyframes type4{0%,46%{transform:scaleX(0)} 54%,91%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)}}
.typing5{animation:type5 12s steps(2,end) infinite;transform-origin:54px 172px;} @keyframes type5{0%,55%{transform:scaleX(0)} 63%,91%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)}}
      .typecursor {animation:cursorMove 12s linear infinite, blink .85s step-end infinite;}
      @keyframes cursorMove {0%{transform:translate(0px,0px)} 10%{transform:translate(0px,0px)} 18%{transform:translate(235.6px,0px)} 19%{transform:translate(0px,24px)} 27%{transform:translate(0px,24px)} 28%{transform:translate(0px,48px)} 36%{transform:translate(205.2px,48px)} 37%{transform:translate(0px,72px)} 45%{transform:translate(121.6px,72px)} 46%{transform:translate(0px,96px)} 54%{transform:translate(174.79999999999998px,96px)} 55%{transform:translate(0px,120px)} 63%{transform:translate(15.2px,120px)} 72%,100%{transform:translate(15px,120px)}}
      .ready {animation:ready 12s infinite;} @keyframes ready {0%,66%{opacity:0}72%,91%{opacity:1}97%,100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.editor,.typing,.typecursor,.ready{animation:none!important}.typecursor{display:none}}

      .pt {animation: pt 12s infinite;}
      .en {opacity:0;animation: en 12s infinite;}
      .cursor {animation: blink 1.6s ease-in-out infinite;}
      .trace {animation: flow 9s linear infinite;}
      .progress {transform-origin:64px 323px;animation: progress 6s linear infinite;}
      @keyframes pt {0%,44%,100%{opacity:1} 50%,94%{opacity:0}}
      @keyframes en {0%,44%,100%{opacity:0} 50%,94%{opacity:1}}
      @keyframes blink {0%,100%{opacity:1} 50%{opacity:.25}}
      @keyframes flow {to{stroke-dashoffset:-590}}
      @keyframes progress {from{transform:scaleX(.02)}to{transform:scaleX(1)}}
      @media (prefers-reduced-motion: reduce) {.pt,.en,.cursor,.trace,.progress{animation:none!important}}
    </style>
  </defs>
