        <text x="683" y="324" text-anchor="end" font-size="11" letter-spacing="1.2" fill="#9DAAC0">PT-BR / 01</text>
      </g>
      <g class="en">
        <text x="64" y="167" font-size="24" font-weight="700" fill="url(#accent)">Software development</text>
        <text x="64" y="205" font-size="18" fill="#AEBBD0">Web applications, artificial intelligence and automation.</text>
        <text x="84" y="285" font-size="14" fill="#B8C8D8">Technology, creativity and continuous learning</text>
        <text x="683" y="324" text-anchor="end" font-size="11" letter-spacing="1.2" fill="#9DAAC0">EN / 02</text>
      </g>
      <g font-size="12" font-weight="600" fill="#D6E0EE">
        <rect x="64" y="226" width="70" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="99" y="245" text-anchor="middle">React</text>
        <rect x="144" y="226" width="92" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="190" y="245" text-anchor="middle">Supabase</text>
        <rect x="246" y="226" width="82" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="287" y="245" text-anchor="middle">Next.js</text>
        <rect x="338" y="226" width="91" height="29" rx="7" fill="#182334" stroke="#344259"/><text x="383.5" y="245" text-anchor="middle">AI &amp; Code</text>
      </g>
      <circle cx="69" cy="280" r="4" fill="#5EEAD4"/>
      <rect x="64" y="322" width="530" height="2" rx="1" fill="#29364B"/>
      <rect class="progress" x="64" y="322" width="530" height="2" rx="1" fill="url(#accent)"/>
    </g>
    <g transform="translate(755 53)"><g class="editor">
      <rect x="8" y="12" width="390" height="252" rx="17" fill="#050914" opacity=".55"/>
      <rect width="390" height="252" rx="17" fill="#0D1523" stroke="#455773"/>
      <path d="M0 36H390M0 58H390" stroke="#2B364A"/>
      <circle cx="20" cy="18" r="4.5" fill="#F28B82"/><circle cx="35" cy="18" r="4.5" fill="#F2CD80"/><circle cx="50" cy="18" r="4.5" fill="#7DD3B0"/>
      <text x="195" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#9DAAC0">workspace</text>
      <rect x="10" y="37" width="111" height="21" fill="#19243A"/><path d="M10 37H121" stroke="#8AC9FF"/><text x="19" y="51" font-family="monospace" font-size="10" fill="#8AC9FF">TS</text><text x="41" y="51" font-family="monospace" font-size="10" fill="#D6E0EE">index.ts</text>
      <g transform="translate(0 15)" font-family="monospace" font-size="12.5" xml:space="preserve"><text x="20" y="65" fill="#66758C">01</text><text x="54" y="65" clip-path="url(#type0)"><tspan fill="#C4B5FD">import</tspan><tspan fill="#E2E8F0"> { ideas } </tspan><tspan fill="#C4B5FD">from</tspan><tspan fill="#A7F3D0"> "./mind";</tspan></text><text x="20" y="89" fill="#66758C">02</text><text x="54" y="89" clip-path="url(#type1)"></text><text x="20" y="113" fill="#66758C">03</text><text x="54" y="113" clip-path="url(#type2)"><tspan fill="#C4B5FD">const</tspan><tspan fill="#93C5FD"> build </tspan><tspan fill="#E2E8F0">= async () =&gt; {</tspan></text><text x="20" y="137" fill="#66758C">04</text><text x="54" y="137" clip-path="url(#type3)"><tspan fill="#C4B5FD">  await</tspan><tspan fill="#A7F3D0"> learn();</tspan></text><text x="20" y="161" fill="#66758C">05</text><text x="54" y="161" clip-path="url(#type4)"><tspan fill="#C4B5FD">  return</tspan><tspan fill="#93C5FD"> create(ideas);</tspan></text><text x="20" y="185" fill="#66758C">06</text><text x="54" y="185" clip-path="url(#type5)"><tspan fill="#E2E8F0">};</tspan></text>
      <rect class="typecursor" x="54" y="54" width="2" height="15" rx="1" fill="#5EEAD4"/></g>
      <path d="M14 214H376" stroke="#263247"/>
      <g class="ready"><circle cx="22" cy="230" r="4" fill="#5EEAD4"/><text x="33" y="234" font-family="monospace" font-size="11" fill="#75E7B9">Ready to build.</text></g>
      <text x="372" y="234" text-anchor="end" font-family="monospace" font-size="10" fill="#8190A8">TypeScript · UTF-8</text>
    </g></g>
    <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#3B4A61"/>
